
{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block content %}
  <h1>Extend Membership Duration</h1>
  <p>Selected members:</p>
  <ul>
    {% for member in members %}
      <li>{{ member.user.username }} — expires on {{ member.expiry_date }}</li>
    {% endfor %}
  </ul>

  <form action="" method="post">{% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="action" value="extend_membership">
    <input type="submit" name="apply" value="Apply" class="default">
  </form>
{% endblock %}
